name: Build & Publish Native App Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach built packages to (e.g. v0.0.3-alpha)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (.zip, .deb, .AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies (PyInstaller & Tk)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk squashfs-tools file
          python -m pip install --upgrade pip pyinstaller

      - name: Run full test suite
        run: python -m unittest discover -s tests -v

      - name: Read version & build universal plugin ZIP + .deb
        id: meta
        run: |
          VERSION=$(python -c "import json; print(json.load(open('plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/build_packages.py --target deb

      - name: Compile standalone Linux launcher binary with PyInstaller
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          pyinstaller \
            --onefile \
            --name startup-antigravity \
            --add-data "dist/startup-antigravity-v${VERSION}.zip:." \
            launcher/app.py

      - name: Download appimagetool & build Linux x86_64 AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 python scripts/build_packages.py \
            --target appimage \
            --binary dist/startup-antigravity \
            --appimagetool /tmp/appimagetool

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/startup-antigravity-v*.zip
            dist/startup-antigravity_*_all.deb
            dist/StartupAntigravity-v*-x86_64.AppImage

  build-macos:
    name: macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller & Pillow
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Build plugin ZIP, generate native .icns icon & compile macOS .app bundle
        id: meta
        run: |
          VERSION=$(python -c "import json; print(json.load(open('plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python scripts/package_release.py
          python scripts/generate_app_icons.py
          pyinstaller \
            --windowed \
            --name "Startup Antigravity" \
            --icon dist/icons/startup-antigravity.icns \
            --add-data "dist/startup-antigravity-v${VERSION}.zip:." \
            launcher/app.py

      - name: Package macOS .dmg installer
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          mkdir -p dist/dmg_stage
          cp -R "dist/Startup Antigravity.app" dist/dmg_stage/
          ln -s /Applications dist/dmg_stage/Applications
          hdiutil create \
            -volname "Startup Antigravity v${VERSION}" \
            -srcfolder dist/dmg_stage \
            -ov -format UDZO \
            "dist/StartupAntigravity-v${VERSION}-macos-arm64.dmg"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: dist/StartupAntigravity-v*-macos-arm64.dmg

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller & Pillow
        run: python -m pip install --upgrade pip pyinstaller pillow

      - name: Build plugin ZIP, generate native .ico icon & compile standalone Windows .exe
        shell: pwsh
        run: |
          $VERSION = python -c "import json; print(json.load(open('plugin.json'))['version'])"
          python scripts/package_release.py
          python scripts/generate_app_icons.py
          pyinstaller `
            --onefile `
            --windowed `
            --name "StartupAntigravity-v${VERSION}-win64" `
            --icon dist/icons/startup-antigravity.ico `
            --add-data "dist/startup-antigravity-v${VERSION}.zip;." `
            launcher/app.py

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/StartupAntigravity-v*-win64.exe

  publish-release:
    name: Publish All Packages to GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          if [[ "$TAG" != v* ]]; then
            VERSION=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
            TAG="v${VERSION}"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG — Startup Antigravity (Ethical Venture OS)" \
              --notes-file CHANGELOG.md \
              --prerelease
          fi
