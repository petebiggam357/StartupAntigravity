<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__DECK_TITLE__</title>
  <style>
    :root {
      --bg: __THEME_BG__;
      --surface: __THEME_SURFACE__;
      --text: __THEME_TEXT__;
      --muted: __THEME_MUTED__;
      --accent: __THEME_ACCENT__;
      --accent2: __THEME_ACCENT2__;
      --border: __THEME_BORDER__;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #030712;
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top HUD */
    .hud {
      height: 48px;
      padding: 0 20px;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      z-index: 20;
      user-select: none;
    }
    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--text);
    }
    .hud-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.active { background: var(--accent); color: #052e16; border-color: var(--accent); font-weight: 700; }
    .timer {
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.35);
      cursor: pointer;
    }
    .timer.warn { background: rgba(245, 158, 11, 0.16); color: #F59E0B; border-color: rgba(245, 158, 11, 0.45); }
    .timer.over { background: rgba(239, 68, 68, 0.18); color: #F87171; border-color: rgba(239, 68, 68, 0.5); }

    /* Stage */
    .stage-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .deck {
      width: min(100%, calc((100vh - 110px) * 16 / 9));
      aspect-ratio: 16 / 9;
      position: relative;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.65);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--bg);
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 5.5% 6.5%;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      background:
        radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 42%),
        radial-gradient(circle at 8% 95%, color-mix(in srgb, var(--accent2) 10%, transparent), transparent 38%),
        var(--bg);
    }
    .slide.active { display: flex; }

    .kicker {
      font-size: clamp(11px, 1.05vw, 15px);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .headline {
      font-size: clamp(24px, 3.1vw, 46px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text);
      max-width: 92%;
    }

    .subheadline {
      margin-top: 20px;
      font-size: clamp(15px, 1.6vw, 24px);
      line-height: 1.45;
      color: var(--muted);
      max-width: 86%;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      margin: 18px 0;
    }

    /* Cover layout */
    .slide-cover { justify-content: center; }
    .slide-cover .headline { font-size: clamp(30px, 4vw, 60px); }
    .cover-footer {
      margin-top: 32px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: clamp(12px, 1.15vw, 16px);
      color: var(--muted);
    }

    /* Bullets */
    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bullet-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 10px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bullet-label {
      font-size: clamp(13px, 1.25vw, 18px);
      font-weight: 700;
      color: var(--accent);
    }
    .bullet-text {
      font-size: clamp(14px, 1.4vw, 20px);
      line-height: 1.4;
      color: var(--text);
    }

    /* Metrics grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
    }
    .metric-val {
      font-size: clamp(28px, 3.4vw, 52px);
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .metric-lbl {
      margin-top: 6px;
      font-size: clamp(12px, 1.2vw, 17px);
      color: var(--muted);
    }

    /* Two-column */
    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }
    .col-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 24px;
    }
    .col-card h3 {
      font-size: clamp(14px, 1.35vw, 19px);
      color: var(--accent);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .col-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .col-card li {
      font-size: clamp(13px, 1.25vw, 18px);
      line-height: 1.4;
      color: var(--text);
      padding-left: 16px;
      position: relative;
    }
    .col-card li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent2);
    }

    /* Comparison table */
    table.comp {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: clamp(12px, 1.2vw, 17px);
    }
    table.comp th, table.comp td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    table.comp th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-weight: 700;
      font-size: clamp(11px, 1.05vw, 15px);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    table.comp th:nth-child(2), table.comp td:nth-child(2) {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--text);
      font-weight: 700;
    }

    /* Ask slide */
    .ask-grid {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 22px;
      align-items: stretch;
    }
    .ask-hero {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }
    .ask-amount {
      font-size: clamp(34px, 4vw, 58px);
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
    }
    .ask-inst {
      font-size: clamp(12px, 1.15vw, 16px);
      color: var(--muted);
    }
    .alloc-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      border-top: 1px solid var(--border);
      font-size: clamp(12px, 1.15vw, 16px);
    }
    .alloc-pct { font-weight: 700; color: var(--accent2); }

    /* Visual Deck 2.0: Inline SVG Charts, 2x2 Quadrant & Product Mockup */
    .visual-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      min-height: 0;
    }
    .visual-svg {
      width: 100%;
      height: 100%;
      max-height: 360px;
      display: block;
    }
    .product-grid {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 20px;
      align-items: stretch;
    }
    .browser-frame {
      background: #090D16;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .browser-bar {
      height: 30px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
    }
    .browser-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--border);
    }
    .browser-dot.r { background: #EF4444; }
    .browser-dot.y { background: #F59E0B; }
    .browser-dot.g { background: #10B981; }
    .browser-url {
      margin-left: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
    }
    .browser-body {
      flex: 1;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .browser-body img {
      max-width: 100%;
      max-height: 290px;
      border-radius: 8px;
      object-fit: contain;
    }
    .wireframe-step {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: clamp(12px, 1.15vw, 15px);
      color: var(--text);
    }

    .callout {
      background: color-mix(in srgb, var(--accent2) 10%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--accent2) 35%, var(--border));
      border-radius: 8px;
      padding: 10px 16px;
      font-size: clamp(12px, 1.1vw, 15px);
      color: var(--text);
    }

    .slide-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(10px, 0.95vw, 13px);
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    /* Evidence badges */
    .badge {
      display: inline-block;
      font-size: 0.72em;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      vertical-align: middle;
      margin-left: 6px;
      letter-spacing: 0.04em;
    }
    .badge-validated { background: rgba(16, 185, 129, 0.2); color: #34D399; border: 1px solid rgba(16, 185, 129, 0.45); }
    .badge-hypothesis { background: rgba(245, 158, 11, 0.18); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .badge-target { background: rgba(59, 130, 246, 0.18); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.45); }
    body.clean-mode .badge { display: none; }

    /* Progress bar */
    .progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.2s ease;
    }

    /* Speaker Notes Drawer */
    .notes-drawer {
      display: none;
      background: #0F172A;
      border-top: 1px solid var(--border);
      padding: 14px 24px;
      font-size: 14px;
      line-height: 1.5;
      color: #E2E8F0;
      max-height: 150px;
      overflow-y: auto;
    }
    .notes-drawer.open { display: block; }
    .notes-drawer strong { color: var(--accent); margin-right: 8px; }

    /* Overview Grid Modal */
    .grid-modal {
      display: none;
      position: fixed;
      inset: 48px 0 0 0;
      background: rgba(3, 7, 18, 0.94);
      z-index: 50;
      padding: 28px;
      overflow-y: auto;
    }
    .grid-modal.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; align-content: start; }
    .grid-thumb {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .grid-thumb:hover, .grid-thumb.current { border-color: var(--accent); transform: translateY(-2px); }
    .grid-thumb .num { font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .grid-thumb .ttl { font-size: 14px; font-weight: 700; color: var(--text); }

    /* Print to PDF (16:9 slide per page) */
    @media print {
      @page { size: 13.333in 7.5in; margin: 0; }
      body { background: var(--bg); height: auto; overflow: visible; display: block; }
      .hud, .notes-drawer, .grid-modal, .progress { display: none !important; }
      .stage-wrap { padding: 0; display: block; overflow: visible; }
      .deck { width: 100%; aspect-ratio: auto; box-shadow: none; border: none; border-radius: 0; overflow: visible; }
      .slide {
        display: flex !important;
        position: relative !important;
        width: 13.333in;
        height: 7.5in;
        page-break-after: always;
        break-after: page;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .slide:last-of-type { page-break-after: auto; break-after: auto; }
    }
  </style>
</head>
<body>
  <header class="hud">
    <div class="hud-brand">
      <span class="hud-dot"></span>
      <span id="hudCompany">__COMPANY_NAME__</span>
      <span id="hudCounter" style="color: var(--muted); font-weight: 400;">1 / 12</span>
    </div>
    <div class="hud-controls">
      <button class="timer" id="timerBtn" title="Click or press T to start/reset 3-min FI pitch timer">03:00</button>
      <button class="btn" id="prevBtn" title="Previous (Left Arrow)">← Prev</button>
      <button class="btn" id="nextBtn" title="Next (Right Arrow / Space)">Next →</button>
      <button class="btn" id="notesBtn" title="Toggle Speaker Notes (S)">Notes (S)</button>
      <button class="btn" id="gridBtn" title="Slide Overview (G)">Grid (G)</button>
      <button class="btn" id="badgesBtn" title="Toggle Evidence Tags (B)">Tags (B)</button>
      <button class="btn" id="printBtn" title="Print / Save 16:9 PDF">Export PDF</button>
    </div>
  </header>

  <main class="stage-wrap">
    <section class="deck" id="deck">
      __SLIDES_HTML__
      <div class="progress" id="progressBar"></div>
    </section>
  </main>

  <aside class="notes-drawer" id="notesDrawer">
    <strong>SPEAKER NOTES:</strong>
    <span id="notesText"></span>
  </aside>

  <section class="grid-modal" id="gridModal"></section>

  <script>
    (function () {
      const TARGET_SECONDS = __TARGET_SECONDS__;
      const slides = Array.from(document.querySelectorAll(".slide"));
      const counter = document.getElementById("hudCounter");
      const progressBar = document.getElementById("progressBar");
      const notesDrawer = document.getElementById("notesDrawer");
      const notesText = document.getElementById("notesText");
      const notesBtn = document.getElementById("notesBtn");
      const gridModal = document.getElementById("gridModal");
      const gridBtn = document.getElementById("gridBtn");
      const badgesBtn = document.getElementById("badgesBtn");
      const timerBtn = document.getElementById("timerBtn");

      let idx = 0;
      let remaining = TARGET_SECONDS;
      let timerId = null;

      function formatTime(sec) {
        const neg = sec < 0;
        const abs = Math.abs(sec);
        const m = String(Math.floor(abs / 60)).padStart(2, "0");
        const s = String(abs % 60).padStart(2, "0");
        return (neg ? "-" : "") + m + ":" + s;
      }

      function renderTimer() {
        timerBtn.textContent = formatTime(remaining);
        timerBtn.classList.toggle("warn", remaining <= 45 && remaining > 0);
        timerBtn.classList.toggle("over", remaining <= 0);
      }

      function toggleTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
          remaining = TARGET_SECONDS;
          renderTimer();
          return;
        }
        timerId = setInterval(() => {
          remaining -= 1;
          renderTimer();
        }, 1000);
      }

      function buildGrid() {
        gridModal.innerHTML = "";
        slides.forEach((s, i) => {
          const card = document.createElement("div");
          card.className = "grid-thumb" + (i === idx ? " current" : "");
          const kicker = s.querySelector(".kicker")?.textContent || ("Slide " + (i + 1));
          const headline = s.querySelector(".headline")?.textContent || "";
          card.innerHTML = `<div class="num">${i + 1}. ${kicker}</div><div class="ttl">${headline}</div>`;
          card.onclick = () => {
            go(i);
            toggleGrid(false);
          };
          gridModal.appendChild(card);
        });
      }

      function toggleGrid(force) {
        const open = typeof force === "boolean" ? force : !gridModal.classList.contains("open");
        gridModal.classList.toggle("open", open);
        gridBtn.classList.toggle("active", open);
        if (open) buildGrid();
      }

      function go(newIdx) {
        idx = Math.max(0, Math.min(slides.length - 1, newIdx));
        slides.forEach((s, i) => s.classList.toggle("active", i === idx));
        counter.textContent = `${idx + 1} / ${slides.length}`;
        progressBar.style.width = `${((idx + 1) / slides.length) * 100}%`;
        notesText.textContent = slides[idx].dataset.notes || "No speaker notes for this slide.";
        window.location.hash = `#slide-${idx + 1}`;
      }

      document.getElementById("prevBtn").onclick = () => go(idx - 1);
      document.getElementById("nextBtn").onclick = () => go(idx + 1);
      notesBtn.onclick = () => {
        const open = notesDrawer.classList.toggle("open");
        notesBtn.classList.toggle("active", open);
      };
      gridBtn.onclick = () => toggleGrid();
      badgesBtn.onclick = () => {
        const clean = document.body.classList.toggle("clean-mode");
        badgesBtn.classList.toggle("active", clean);
      };
      timerBtn.onclick = toggleTimer;
      document.getElementById("printBtn").onclick = () => window.print();

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(idx + 1); }
        else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
        else if (e.key === "Home") go(0);
        else if (e.key === "End") go(slides.length - 1);
        else if (e.key.toLowerCase() === "s") notesBtn.click();
        else if (e.key.toLowerCase() === "g") toggleGrid();
        else if (e.key.toLowerCase() === "b") badgesBtn.click();
        else if (e.key.toLowerCase() === "t") toggleTimer();
        else if (e.key === "Escape") toggleGrid(false);
      });

      const hashMatch = window.location.hash.match(/^#slide-(\d+)$/);
      renderTimer();
      go(hashMatch ? parseInt(hashMatch[1], 10) - 1 : 0);
    })();
  </script>
</body>
</html>
